<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pizzapp — dough scheduler</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>🍕 Pizza planner</h1>
      <p class="tagline">Tell it when you want to bake — it works out when to start.</p>

      <form id="scheduler-form">
        <label class="field">
          <span>Start baking at</span>
          <input type="datetime-local" id="bake-start" name="bakeStart" required />
        </label>

        <fieldset class="field">
          <legend>Fermentation</legend>
          <label class="radio">
            <input type="radio" name="fermentation" value="24h" />
            <span>24-hour</span>
          </label>
          <label class="radio">
            <input type="radio" name="fermentation" value="36h" checked />
            <span>36-hour</span>
          </label>
          <label class="radio">
            <input type="radio" name="fermentation" value="48h" />
            <span>48-hour</span>
          </label>
          <label class="radio">
            <input type="radio" name="fermentation" value="72h" />
            <span>72-hour</span>
          </label>
          <label class="radio">
            <input type="radio" name="fermentation" value="custom" />
            <span>Custom</span>
          </label>
        </fieldset>

        <div class="field custom-times" hidden>
          <label class="field">
            <span>Room-temperature hours (total)</span>
            <input type="number" id="rt-hours" name="rtHours" min="4.5" step="0.5" value="12" />
          </label>
          <label class="field">
            <span>Cold / fridge hours (total)</span>
            <input type="number" id="ct-hours" name="ctHours" min="0" step="1" value="24" />
          </label>
        </div>

        <label class="checkbox">
          <input type="checkbox" name="poolish" />
          <span>Use poolish (pre-ferment)</span>
        </label>

        <fieldset class="field">
          <legend>Avoid balling overnight</legend>
          <label class="checkbox">
            <input type="checkbox" name="quiet" checked />
            <span>Don't start balling during quiet hours</span>
          </label>
          <div class="quiet-times">
            <label class="field">
              <span>Quiet from</span>
              <input type="time" id="quiet-start" name="quietStart" value="22:00" />
            </label>
            <label class="field">
              <span>until</span>
              <input type="time" id="quiet-end" name="quietEnd" value="08:00" />
            </label>
          </div>
        </fieldset>
      </form>

      <p id="error" class="error" role="alert"></p>

      <h2>Your schedule</h2>
      <ol id="schedule" class="schedule"></ol>

      <footer class="credit">
        Recipes based on <em>Pizzamani</em> by René —
        <a href="https://www.friskforlag.no/produkt/pizzamani/" target="_blank" rel="noopener">
          friskforlag.no
        </a>.
      </footer>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
